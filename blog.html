<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Blog</title>
<style>
body{font-family:Arial;padding:40px;}
.post{
  border:1px solid #ddd;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
}
</style>
</head>
<body>

<h1>Blog</h1>
<div id="posts"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvBUoZTLYFlUtpKyovzfcqFz_iRyxMx-A",
  authDomain: "gold-yen-483319-b8.firebaseapp.com",
  projectId: "gold-yen-483319-b8",
  storageBucket: "gold-yen-483319-b8.firebasestorage.app",
  messagingSenderId: "247550198870",
  appId: "1:247550198870:web:bde05d361f0ed3baf2a7f7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadPosts(){

  const querySnapshot = await getDocs(collection(db, "posts"));

  querySnapshot.forEach((doc) => {

    const data = doc.data();

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <h3>${data.title}</h3>
      <p>${data.content}</p>
    `;

    document.getElementById("posts").appendChild(div);

  });

}

loadPosts();

</script>

</body>
</html>
