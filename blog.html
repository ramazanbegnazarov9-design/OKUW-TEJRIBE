<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro Blog</title>

<style>
body{
  font-family:Segoe UI;
  margin:0;
  padding:40px;
  background:#f4f6f9;
  transition:0.3s;
}

.dark{
  background:#111827;
  color:white;
}

.toggle{
  position:fixed;
  top:20px;
  right:20px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.dark .card{
  background:#1f2937;
  color:white;
}

.comment-box{
  margin-top:10px;
}
</style>
</head>
<body>

<button class="toggle">🌙 Toggle</button>

<h1>🔥 Live Blog</h1>
<div class="grid" id="posts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SENIN_API_KEY",
  authDomain: "SENIN_AUTH_DOMAIN",
  projectId: "SENIN_PROJECT_ID",
  storageBucket: "SENIN_STORAGE_BUCKET",
  messagingSenderId: "SENIN_MESSAGING_ID",
  appId: "SENIN_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const postsDiv = document.getElementById("posts");

onSnapshot(collection(db,"posts"), snapshot => {

  postsDiv.innerHTML="";

  snapshot.forEach(docSnap=>{

    const data = docSnap.data();
    const id = docSnap.id;

    const div = document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <h3 contenteditable="true" id="title-${id}">${data.title}</h3>
      <p contenteditable="true" id="content-${id}">${data.content}</p>

      <button onclick="updatePost('${id}')">Edit</button>
      <button onclick="deletePost('${id}')">Delete</button>

      <div class="comment-box">
        <input type="text" id="comment-${id}" placeholder="Write comment">
        <button onclick="addComment('${id}')">Send</button>
      </div>
    `;

    postsDiv.appendChild(div);

  });

});

window.deletePost = async (id)=>{
  await deleteDoc(doc(db,"posts",id));
};

window.updatePost = async (id)=>{
  const newTitle = document.getElementById("title-"+id).innerText;
  const newContent = document.getElementById("content-"+id).innerText;

  await updateDoc(doc(db,"posts",id),{
    title:newTitle,
    content:newContent
  });

  alert("Updated!");
};

window.addComment = async (id)=>{
  const text = document.getElementById("comment-"+id).value;

  await addDoc(collection(db,"posts",id,"comments"),{
    text:text,
    createdAt:new Date()
  });

  alert("Comment added");
};

document.querySelector(".toggle").onclick=()=>{
  document.body.classList.toggle("dark");
};
</script>

</body>
</html>
