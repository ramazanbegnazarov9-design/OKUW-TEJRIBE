<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulbazar | Okuw Tejribe</title>

<style>
   /* Snow animation */
.snow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
}

.snow span {
  position: absolute;
  top: -10px;
  color: white;
  font-size: 10px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh);
  }
} 
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    color: white;
    text-align: center;
}

header {
    padding: 60px 20px;
}

h1 {
    font-size: 50px;
    margin-bottom: 10px;
}

p {
    font-size: 20px;
}

.button {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background: white;
    color: #333;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    transition: 0.3s;
}

.button:hover {
    background: #333;
    color: white;
}

.section {
    background: white;
    color: #333;
    padding: 60px 20px;
}

.card {
    background: #f4f4f4;
    padding: 20px;
    margin: 20px auto;
    max-width: 300px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<header>
    <h1>Okuw Tejribe</h1>
    <p>Bilim – üstünlik açary 🚀</p>
    <a href="#biz" class="button">Başla</a>
   <br><br>
<a href="kurs.html" class="button">Kurslar</a>
<a href="blog.html" class="button">Blog</a>
</header>

<div class="section" id="biz">
    <h2>Biz barada</h2>
    <div class="card">
        <p>Bu sahypa web programmirleme öwrenmek üçin döredildi.</p>
    </div>

    <div class="card">
        <p>HTML, CSS we JavaScript öwrenilýär.</p>
    </div>
</div>
<div class="snow"></div>

<script>
const snowContainer = document.querySelector('.snow');

for (let i = 0; i < 100; i++) {
  let snowflake = document.createElement('span');
  snowflake.innerHTML = "❄";
  snowflake.style.left = Math.random() * 100 + "vw";
  snowflake.style.animationDuration = (Math.random() * 5 + 5) + "s";
  snowflake.style.opacity = Math.random();
  snowflake.style.fontSize = (Math.random() * 10 + 10) + "px";
  snowContainer.appendChild(snowflake);
}
</script>
</body>
</html>
