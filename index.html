<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulbazar | Okuw Platforma</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
scroll-behavior:smooth;
}

body{
background:#0f2027;
color:white;
}

/* NAVBAR */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:rgba(0,0,0,0.6);
backdrop-filter: blur(10px);
z-index:1000;
}

.logo{
font-size:22px;
font-weight:bold;
}

.menu a{
margin-left:20px;
text-decoration:none;
color:white;
font-weight:500;
transition:0.3s;
}

.menu a:hover{
color:#00f2fe;
}

/* HERO */
header{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(135deg,#1e3c72,#2a5298);
}

header h1{
font-size:60px;
margin-bottom:20px;
animation:fadeIn 2s ease;
}

header p{
font-size:20px;
margin-bottom:30px;
opacity:0.9;
}

.button{
padding:12px 30px;
background:white;
color:#333;
border-radius:30px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.button:hover{
background:#00f2fe;
color:white;
}

/* SECTIONS */
.section{
padding:100px 20px;
text-align:center;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:40px;
}

.card{
background:white;
color:#333;
padding:30px;
border-radius:15px;
width:280px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
background:#000;
}

/* Animation */
@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* Responsive */
@media(max-width:768px){
header h1{
font-size:40px;
}
.cards{
flex-direction:column;
align-items:center;
}
}
</style>
</head>

<body>

<nav>
<div class="logo">Gulbazar</div>
<div class="menu">
<a href="#home">Baş sahypa</a>
<a href="#about">Biz barada</a>
<a href="kurs.html">Kurslar</a>
<a href="blog.html">Blog</a>
<a href="login.html">Login</a> 
</div>
</nav>

<header id="home">
<h1>Okuw Platforma 🚀</h1>
<p>HTML, CSS we JavaScript öwreniň</p>
<a href="#about" class="button">Başla</a>
</header>

<section class="section" id="about">
<h2>Biz barada</h2>

<div class="cards">
<div class="card">
<h3>Frontend</h3>
<p>HTML, CSS, JavaScript</p>
</div>

<div class="card">
<h3>Responsive</h3>
<p>Telefon we kompýuter üçin</p>
</div>

<div class="card">
<h3>Praktika</h3>
<p>Amaly taslamalar bilen öwreniň</p>
</div>
</div>

</section>

<footer>
© 2026 Gulbazar.store | All Rights Reserved
</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvBUoZTLYFlUtpKyovzfcqFz_iRyxMx-A",
  authDomain: "gold-yen-483319-b8.firebaseapp.com",
  projectId: "gold-yen-483319-b8",
  storageBucket: "gold-yen-483319-b8.firebasestorage.app",
  messagingSenderId: "247550198870",
  appId: "1:247550198870:web:bde05d361f0ed3baf2a7f7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

  if(user){
    // User bar
    const menu = document.querySelector(".menu");

    const userInfo = document.createElement("span");
    userInfo.style.marginLeft = "20px";
    userInfo.innerText = user.email;

    const logoutBtn = document.createElement("button");
    logoutBtn.innerText = "Logout";
    logoutBtn.style.marginLeft = "10px";
    logoutBtn.style.padding = "5px 10px";
    logoutBtn.style.cursor = "pointer";

    logoutBtn.onclick = () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    };

    menu.appendChild(userInfo);
    menu.appendChild(logoutBtn);

  } else {
    // User ýok → login sahypa geçir
    window.location.href = "login.html";
  }

});
</script>
</body>
</html>
