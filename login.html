<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

<h2>Login / Register</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<br><br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* 🔥 Şu ýerde öz Firebase config goý */

const firebaseConfig = {
  apiKey: "AIzaSyAvBUoZTLYFlUtpKyovzfcqFz_iRyxMx-A",
  authDomain: "gold-yen-483319-b8.firebaseapp.com",
  projectId: "gold-yen-483319-b8",
  storageBucket: "gold-yen-483319-b8.firebasestorage.app",
  messagingSenderId: "247550198870",
  appId: "1:247550198870:web:bde05d361f0ed3baf2a7f7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

createUserWithEmailAndPassword(auth, email, password)
.then(() => alert("Hasap döredildi!"))
.catch(error => alert(error.message));
}

window.login = function(){
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

signInWithEmailAndPassword(auth, email, password)
.then(() => {
alert("Login üstünlikli!");
window.location.href = "index.html";
})
.catch(error => alert(error.message));
}

</script>

</body>
</html>
