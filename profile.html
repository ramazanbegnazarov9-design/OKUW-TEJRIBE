<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profile</title>
<style>
body{
  font-family: Arial;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  text-align:center;
  padding-top:80px;
}

.card{
  background:white;
  color:black;
  width:350px;
  margin:auto;
  padding:30px;
  border-radius:15px;
}

input, textarea{
  width:100%;
  padding:8px;
  margin:5px 0;
}

button{
  margin-top:10px;
  padding:8px 15px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="card">
  <h2>User Profile</h2>

  <p id="email"></p>

  <input type="text" id="name" placeholder="Adyň">
  <textarea id="bio" placeholder="Bio ýaz"></textarea>

  <button id="save">Save</button>
  <button id="logout">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvBUoZTLYFlUtpKyovzfcqFz_iRyxMx-A",
  authDomain: "gold-yen-483319-b8.firebaseapp.com",
  projectId: "gold-yen-483319-b8",
  storageBucket: "gold-yen-483319-b8.firebasestorage.app",
  messagingSenderId: "247550198870",
  appId: "1:247550198870:web:bde05d361f0ed3baf2a7f7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;

onAuthStateChanged(auth, async (user) => {

  if(user){
    currentUser = user;
    document.getElementById("email").innerText = "Email: " + user.email;

    const docRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(docRef);

    if(docSnap.exists()){
      document.getElementById("name").value = docSnap.data().name || "";
      document.getElementById("bio").value = docSnap.data().bio || "";
    }

  } else {
    window.location.href = "login.html";
  }

});

document.getElementById("save").onclick = async () => {

  const name = document.getElementById("name").value;
  const bio = document.getElementById("bio").value;

  await setDoc(doc(db, "users", currentUser.uid), {
    name: name,
    bio: bio
  });

  alert("Saved successfully!");
};

document.getElementById("logout").onclick = () => {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};

</script>

</body>
</html>
