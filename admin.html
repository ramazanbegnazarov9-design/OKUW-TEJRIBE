<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{font-family:Arial;padding:40px;}
input,textarea{width:300px;padding:8px;margin-bottom:10px;}
button{padding:8px 15px;cursor:pointer;}
</style>
</head>
<body>

<h1>Admin Panel</h1>

<h2>Add Blog Post</h2>

<input type="text" id="title" placeholder="Title"><br>
<textarea id="content" placeholder="Content"></textarea><br>
<button id="addPost">Add Post</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvBUoZTLYFlUtpKyovzfcqFz_iRyxMx-A",
  authDomain: "gold-yen-483319-b8.firebaseapp.com",
  projectId: "gold-yen-483319-b8",
  storageBucket: "gold-yen-483319-b8.firebasestorage.app",
  messagingSenderId: "247550198870",
  appId: "1:247550198870:web:bde05d361f0ed3baf2a7f7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {

  if(!user){
    window.location.href = "login.html";
  }

});

document.getElementById("addPost").onclick = async () => {

  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  if(title === "" || content === ""){
    alert("Boş goýma!");
    return;
  }

  await addDoc(collection(db, "posts"), {
    title: title,
    content: content,
    createdAt: new Date()
  });

  alert("Post goşuldy 🔥");

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";
};

</script>

</body>
</html>
